x-app: &app
  image: hybrid-product-search:local
  build: .
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 15s
  volumes:
    - model-cache:/models
  environment:
    DATABASE_URL: postgresql://hybrid:disposable-local-demo@db:5432/hybrid
    INFERENCE_THREADS: "2"
    NO_PROXY: "localhost,127.0.0.1,db,api"
    no_proxy: "localhost,127.0.0.1,db,api"

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: hybrid
      POSTGRES_PASSWORD: disposable-local-demo
      POSTGRES_DB: hybrid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hybrid -d hybrid"]
      interval: 2s
      timeout: 3s
      retries: 20

  index:
    <<: *app
    command: [index]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: [serve, --host, "0.0.0.0"]
    ports:
      - "127.0.0.1:${SEARCH_PORT:-8080}:8080"
    depends_on:
      index:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  postgres-data:
  model-cache:
