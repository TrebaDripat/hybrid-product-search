<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ranking explorer · Hybrid Product Search</title>
    <link rel="stylesheet" href="/assets/explorer.css" />
    <script src="/assets/explorer.js" defer></script>
  </head>
  <body>
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="/"
          ><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Hybrid Product
          Search</a
        >
        <nav aria-label="Project links">
          <a href="/docs">API docs</a
          ><a href="https://github.com/TrebaDripat/hybrid-product-search">GitHub</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="title-row">
        <h1>Ranking explorer</h1>
        <span id="catalog" class="catalog"></span>
      </div>
      <form id="form">
        <label class="query-label" for="query">Product query</label>
        <div class="search-line">
          <input
            id="query"
            type="search"
            value="grind beans while camping without electricity"
            required
            maxlength="300"
            autocomplete="off"
          /><button id="submit" type="submit">Search <span aria-hidden="true">↵</span></button>
        </div>
        <div class="controls">
          <label>First ranking<select id="first"></select></label>
          <label>Compare with<select id="second"></select></label>
          <label
            >Category<input
              id="category"
              placeholder="All categories"
              maxlength="40"
              pattern="[a-z0-9_\-]{1,40}"
          /></label>
          <label
            >Max price (USD)<input
              id="price"
              type="number"
              inputmode="decimal"
              min="0"
              max="21474836.47"
              step="0.01"
              placeholder="Any price"
          /></label>
          <label class="check"><input type="checkbox" id="stock" /> In stock only</label>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="results" aria-label="Ranked products" aria-busy="false"></section>
      <noscript
        >Enable JavaScript to compare rankings, or use the
        <a href="/docs">API documentation</a>.</noscript
      >
    </main>
  </body>
</html>
